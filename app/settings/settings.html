<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Authkey Settings</title>

    <link rel="stylesheet" href="settings.css">

    <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
</head>

<body>

<div class="container">
    <h2>Authkey Configuration</h2>

    <div id="configurationForm">
        <label for="email">Authkey Account Email</label>
        <input
            id="email"
            type="email"
            placeholder="Enter the email used on Authkey"
            autocomplete="email">

        <label for="authkey">Enter Authkey</label>
        <input
            id="authkey"
            type="password"
            placeholder="Paste your Authkey here"
            autocomplete="off">

        <button id="saveBtn" type="button">Save</button>
    </div>

    <div id="configuredView" class="hidden">
        <div class="credential-row">
            <span class="credential-label">Email</span>
            <span id="configuredEmail" class="credential-value"></span>
        </div>
        <div class="credential-row">
            <span class="credential-label">Authkey</span>
            <span id="configuredAuthkey" class="credential-value"></span>
        </div>

        <button id="changeBtn" type="button">Change Authkey</button>
    </div>

    <p id="status"></p>
</div>

<script src="../common/auth.js"></script>
<script src="../common/api.js"></script>
<script src="../common/ui.js"></script>
<script src="settings.js"></script>
</body>

</html>
