<!DOCTYPE html>

<html>

<head>

<title>Bulk Messaging</title>

<link rel="stylesheet"
href="bulk.css">

</head>

<body>


<div id="leadCount"></div>

<div id="leadList"></div>

<div id="summary"></div>
<hr>

<label>

Channel

</label>

<select id="channel">

<option value="whatsapp">

WhatsApp

</option>

<option value="sms">

SMS

</option>

<option value="email">

Email

</option>

<option value="voice">

Voice

</option>

<option value="rcs">

RCS

</option>

</select>

<br><br>

<label>

Template

</label>

<select id="templateSelect">

</select>
<br><br>
<label>Template Preview</label>

<textarea
    id="preview"
    rows="8"
    readonly>
</textarea>

<br><br>

<div id="variablesContainer"></div>

<br>

<button id="sendBtn">
    Send to Selected Leads
</button>

<div id="progress">

</div>

<script
src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js">
</script>

<script src="../common/auth.js"></script>
<script src="../common/api.js"></script>
<script src="../common/lead.js"></script>
<script src="../common/template.js"></script>
<script src="../common/variables.js"></script>
<script src="../common/ui.js"></script>
<script src="../common/preview.js"></script>

<script src="bulk.js">

</script>

</body>

</html>
